name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Run tests
        run: python -m pytest -q

      - name: Run Stage 4 persistence acceptance
        run: python scripts/stage4_persistence_acceptance.py

      - name: Run pilot durability acceptance
        run: python scripts/stage5_runtime_durability_acceptance.py
