[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/bin/sh -c \"mkdir -p /data/state-volume /data/backup-staging && python scripts/pilot_calendar_storage.py bootstrap && exec python scripts/pilot_calendar_runtime.py\""
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
